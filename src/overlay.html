<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DSH</title>
<style>
  :root { color-scheme: light; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #ffffff; color: #1f1f1f;
    font: 13px/1.6 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    display: flex; align-items: center; justify-content: center;
    -webkit-user-select: none; user-select: none;
  }
  .wrap { text-align: center; transform: translateY(-4vh); }
  .spinner {
    width: 26px; height: 26px; margin: 0 auto 18px;
    border: 2.5px solid rgba(0,0,0,.10);
    border-top-color: rgba(0,0,0,.55);
    border-radius: 50%;
    animation: spin 900ms linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .msg { font-size: 14px; letter-spacing: .2px; color: #1f1f1f; }
  .sub { margin-top: 6px; font-size: 12px; color: rgba(0,0,0,.42); min-height: 18px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="spinner"></div>
    <div class="msg">正在检查服务…</div>
    <div class="sub"></div>
  </div>
  <script>
    window.__dshSet = function (msg, sub) {
      var m = document.querySelector('.msg');
      var s = document.querySelector('.sub');
      if (m && typeof msg === 'string' && msg.length) m.textContent = msg;
      if (s) s.textContent = sub || '';
    };
  </script>
</body>
</html>
